server {
    listen 80;
    listen [::]:80;
    server_name feedpilot.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name feedpilot.example.com;

    # Configure actual certificate paths for your host.
    ssl_certificate /etc/letsencrypt/live/feedpilot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedpilot.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers at edge (app also sets headers).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # GTD sticker PDFs can be large (app allows up to 250 MB per file).
    # 20m caused HTTP 413 when appending several packs to an existing ГТД.
    client_max_body_size 300m;
    client_body_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Long-running requests (sync, GTD upload/scan, preview) need extended timeout
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
    }
}
