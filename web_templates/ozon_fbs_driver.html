<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c4a6e" />
  <title>Для водителя · Ozon FBS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/ozon_fbs_driver.css?v=3" />
</head>
<body class="ofd-body">
  <div class="ofd-app">
    <header class="ofd-top">
      <div class="ofd-brand">Для водителя</div>
      <p class="ofd-sub">Ozon FBS · грузоместа к отгрузке</p>
    </header>

    <main class="ofd-main" id="ofdMain">
      <div class="ofd-loading">Загрузка…</div>
    </main>

    <div class="ofd-toast" id="ofdToast" hidden role="status"></div>
  </div>

  <script>
    window.OFD_BOOT = {
      can_view: {{CAN_VIEW_OZON_FBS_DRIVER}},
      is_tenant_owner: {{IS_TENANT_OWNER}},
      email: "{{SAFE_EMAIL}}",
      page_mode: "{{PAGE_MODE}}",
      page_token: "{{PAGE_TOKEN}}"
    };
  </script>
  <script src="/static/ozon_fbs_driver.js?v=3"></script>
</body>
</html>
